[project]
name = "paintmixer"
version = "0.1.0"
description = "Kubelka-Munk paint mixing recipe solver"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "colour-science>=0.4.7",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pexpect>=4.9.0",
    "pydantic>=2",
    "pyserial>=3.5",
    "python-multipart>=0.0.33",
    "scipy>=1.18.1",
    "sqlmodel>=0.0.48",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-jsonschema>=4.26.0.20261006",
    "types-pexpect>=4.9.0.20260518",
    "types-pyserial>=3.5.0.20261104",
]

[project.scripts]
paintmixer = "paintmixer.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/paintmixer/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF015"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.Query", "fastapi.File",
    "fastapi.Form", "fastapi.Body", "fastapi.Path",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
exclude = ["src/paintmixer/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["scipy.*", "colour.*", "pexpect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running performance/accuracy tests"]
filterwarnings = [
    "ignore:.*Matplotlib.* related API features are not available",
    "ignore:Aligning .* shape to",
    "ignore:Using `httpx` with `starlette.testclient`",
]
